<text x="1000" y="663" font-family="Arial, sans-serif" font-size="16" fill="#147d83" font-weight="400">
<tspan x="1000" dy="0">El crawler inspecciona el esquema de MySQL</tspan>
</text>
<rect x="340" y="755" width="1080" height="205" rx="14" fill="#edf2f8" stroke="#c7d3e1" stroke-width="1.5"/>
<text x="360" y="790" font-family="Arial, sans-serif" font-size="22" fill="#173554" font-weight="700">
<tspan x="360" dy="0">Red y servicios de acceso</tspan>
</text>
<text x="360" y="827" font-family="Arial, sans-serif" font-size="18" fill="#536477" font-weight="400">
<tspan x="360" dy="0">RDS y las interfaces de acceso de Glue utilizan la VPC y la subred configuradas.</tspan>
<tspan x="360" dy="26.099999999999998">Security group invacom-dw-sg: acceso MySQL desde IPs autorizadas y comunicación interna.</tspan>
<tspan x="360" dy="26.099999999999998">Endpoints Interface: STS y Secrets Manager. Endpoint Gateway: S3.</tspan>
<tspan x="360" dy="26.099999999999998">Secrets Manager conserva las credenciales de conexión. STS permite asumir el rol de Glue.</tspan>
</text>
<rect x="1510" y="755" width="250" height="155" rx="14" fill="#ffffff" stroke="#c7d3e1" stroke-width="1.5"/>
<text x="1528" y="790" font-family="Arial, sans-serif" font-size="21" fill="#173554" font-weight="700">
<tspan x="1528" dy="0">MySQL Workbench</tspan>
</text>
<text x="1528" y="824" font-family="Arial, sans-serif" font-size="17" fill="#536477" font-weight="400">
<tspan x="1528" dy="0">Crear y consultar tablas</tspan>
<tspan x="1528" dy="24.65">Validar conteos y datos</tspan>
<tspan x="1528" dy="24.65">Acceso TCP 3306</tspan>
</text>
<polyline points="1635,755 1635,700 1310,700 1310,630" fill="none" stroke="#147d83" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#meta)"/>
