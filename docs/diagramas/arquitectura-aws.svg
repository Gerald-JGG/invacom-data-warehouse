<tspan x="40" dy="0">Línea continua: recorrido de datos. Línea discontinua: metadatos o acceso de consulta.</tspan>
</text>
<text x="40" y="1073" font-family="Arial, sans-serif" font-size="19" fill="#173554" font-weight="400">
<tspan x="40" dy="0">Pendiente de comprobar: cargas de DimFecha, DimCancion y FactVenta, recargas sin duplicados y dashboard de ventas.</tspan>
